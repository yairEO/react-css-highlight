name: Publish to npm

# Manual only. Merges do not publish. Run this from the Actions tab
# after package.json version is the release you want.
on:
    workflow_dispatch:

permissions:
    contents: write
    id-token: write

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check
              run: pnpm check

            - name: Publish and release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  NAME=$(node -p "require('./package.json').name")
                  VERSION=$(node -p "require('./package.json').version")
                  TAG="v${VERSION}"

                  case "$VERSION" in
                    *-*) echo "Prerelease versions are not supported: $VERSION" >&2; exit 1 ;;
                  esac

                  if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
                    echo "${NAME}@${VERSION} already on npm"
                    ON_NPM=1
                  else
                    ON_NPM=0
                  fi

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "GitHub release ${TAG} already exists"
                    ON_GH=1
                  else
                    ON_GH=0
                  fi

                  if [ "$ON_NPM" = 1 ] && [ "$ON_GH" = 1 ]; then
                    echo "v${VERSION} is already published. Bump package.json, merge that, then run this workflow again." >&2
                    exit 1
                  fi

                  if [ "$ON_NPM" = 0 ]; then
                    pnpm publish --no-git-checks --provenance
                  fi

                  if [ "$ON_GH" = 0 ]; then
                    gh release create "$TAG" --generate-notes --title "$TAG"
                  fi
