name: Deploy Storybook & Demos to GitHub Pages

# Run workflow on pushes to the 'master' branch
on:
    push:
        branches: [master] # Or 'master' or your default branch

# Push the built site onto gh-pages. Do not use actions/deploy-pages:
# that replaces the whole Pages site, including visual/<run> reports.
permissions:
    contents: write

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "20" # Use a current LTS version
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile # '--frozen-lockfile' is faster and safer for workflows

            - name: Build Storybook
              run: pnpm run build-storybook

            - name: Build Vanilla Demo
              run: |
                  cd examples/vanilla-demo
                  pnpm install --frozen-lockfile
                  pnpm run build

            - name: Copy Vanilla Demo to Storybook
              run: |
                  mkdir -p storybook-static/vanilla-demo
                  cp -r examples/vanilla-demo/dist/* storybook-static/vanilla-demo/

            # keep_files leaves visual/ in place. enable_jekyll stays at its
            # default so the action writes .nojekyll (Jekyll would drop _ paths).
            - name: Publish site to gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_branch: gh-pages
                  publish_dir: ./storybook-static
                  keep_files: true
